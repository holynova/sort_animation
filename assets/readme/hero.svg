<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">排序算法可视化 Sort Animation — 7 种排序，一帧一帧看清楚</title>
  <desc id="desc">浅灰纸面标题：排序算法可视化；右侧是一组由乱到齐的柱状条示意：左边杂乱的粉红柱子向右逐渐排成升序，几根黑柱标出正在比较的位置。</desc>

  <rect width="1200" height="360" rx="26" fill="#f4f4f2"/>

  <g id="deco" opacity="0.6">
    <circle cx="704" cy="54" r="9" fill="#ddd8d2"/>
    <circle cx="730" cy="54" r="5" fill="#ddd8d2"/>
    <circle cx="62" cy="324" r="8" fill="#ddd8d2"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6b5d5d">算法可视化 · SORTING VISUALIZER</text>
    <text x="56" y="130" font-size="60" font-weight="700" fill="#1f1a1a">排序算法可视化</text>
    <text x="56" y="170" font-size="23" fill="#b3402a">SORT ANIMATION — 7 种排序，一帧一帧看清楚</text>
    <text x="56" y="206" font-size="19" fill="#57504e">播放、暂停、单步前进后退，正在比较的柱子标成黑色。</text>
    <g id="chips" font-size="18" fill="#f4f4f2" text-anchor="middle">
      <g><rect x="56" y="238" width="122" height="36" rx="18" fill="#1f1a1a"/><text x="117" y="262">7 种算法</text></g>
      <g><rect x="190" y="238" width="158" height="36" rx="18" fill="#1f1a1a"/><text x="269" y="262">2–500 个样本</text></g>
      <g><rect x="360" y="238" width="140" height="36" rx="18" fill="#1f1a1a"/><text x="430" y="262">单步调试</text></g>
      <g><rect x="512" y="238" width="140" height="36" rx="18" fill="#1f1a1a"/><text x="582" y="262">Canvas 绘制</text></g>
    </g>
  </g>

  <g id="bars-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="800" y="44" width="344" height="272" rx="16" fill="#ffffff" stroke="#ddd8d2" stroke-width="1.5"/>
    <text x="828" y="80" font-size="18" fill="#3d3837">快速排序 · 第 24 帧</text>
    <g id="bars">
      <rect x="828" y="200" width="8" height="80" fill="#f2b8b5"/>
      <rect x="840" y="160" width="8" height="120" fill="#f2b8b5"/>
      <rect x="852" y="230" width="8" height="50" fill="#f2b8b5"/>
      <rect x="864" y="140" width="8" height="140" fill="#1f1a1a"/>
      <rect x="876" y="190" width="8" height="90" fill="#f2b8b5"/>
      <rect x="888" y="120" width="8" height="160" fill="#f2b8b5"/>
      <rect x="900" y="210" width="8" height="70" fill="#f2b8b5"/>
      <rect x="912" y="170" width="8" height="110" fill="#f2b8b5"/>
      <rect x="924" y="100" width="8" height="180" fill="#1f1a1a"/>
      <rect x="936" y="180" width="8" height="100" fill="#f2b8b5"/>
      <rect x="948" y="150" width="8" height="130" fill="#f2b8b5"/>
      <rect x="960" y="220" width="8" height="60" fill="#f2b8b5"/>
      <rect x="972" y="190" width="8" height="90" fill="#f2b8b5"/>
      <rect x="984" y="240" width="8" height="40" fill="#f2b8b5"/>
      <rect x="996" y="200" width="8" height="80" fill="#f2b8b5"/>
      <rect x="1008" y="170" width="8" height="110" fill="#f2b8b5"/>
      <rect x="1020" y="150" width="8" height="130" fill="#f2b8b5"/>
      <rect x="1032" y="140" width="8" height="140" fill="#f2b8b5"/>
      <rect x="1044" y="130" width="8" height="150" fill="#1f1a1a"/>
      <rect x="1056" y="120" width="8" height="160" fill="#f2b8b5"/>
      <rect x="1068" y="112" width="8" height="168" fill="#f2b8b5"/>
      <rect x="1080" y="104" width="8" height="176" fill="#f2b8b5"/>
      <rect x="1092" y="98" width="8" height="182" fill="#f2b8b5"/>
      <rect x="1104" y="92" width="8" height="188" fill="#f2b8b5"/>
    </g>
    <line x1="824" y1="280" x2="1116" y2="280" stroke="#ddd8d2" stroke-width="1.5"/>
    <text x="828" y="304" font-size="18" fill="#3d3837">黑柱 = 正在比较</text>
  </g>
</svg>

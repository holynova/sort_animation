<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="通过实心柱状图、逐步粒子反馈、数组快照和逐行伪代码，观察七种排序算法的每一步。"
    />
    <title>排序观察室 · Sort Lab</title>
    <link rel="icon" href="./images/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/style.css" />
    <script defer src="./app.js"></script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    ></script>
  </head>
  <body>
    <header class="header">
      <div class="wrap mast">
        <div class="brand"><img src="./images/mark.svg" alt="" />SORT LAB</div>
        <span class="brand-cn">排序观察室</span>
        <div class="links">
          <button id="sound" type="button" aria-pressed="false" title="音效 · 关" aria-label="音效 · 关">
            <i data-icon="muted"></i><span>音效 · 关</span>
          </button>
          <button id="help" title="键盘快捷键" aria-label="键盘快捷键">
            <i data-icon="keyboard"></i><span>快捷键</span></button
          ><a
            href="https://github.com/holynova/sort_animation"
            target="_blank"
            rel="noopener"
            aria-label="GitHub 源码"
            ><i data-icon="github"></i><span>源码</span></a
          >
        </div>
      </div>
    </header>
    <main class="wrap">
      <nav id="algorithms" aria-label="选择排序算法"></nav>
      <section class="intro">
        <div>
          <div class="title-line">
            <h1 id="title">冒泡排序</h1>
            <span id="english" lang="en">Bubble sort</span>
          </div>
          <p id="summary">从左向右比较相邻元素，每一趟把当前最大值送到右端。</p>
        </div>
        <div class="inputs">
          <label for="samples"
            >样本数 <input type="number" id="samples" min="2" max="500" step="1" value="12" /></label
          ><button id="shuffle" class="outline"><i data-icon="shuffle"></i>打乱数组</button>
        </div>
      </section>
      <div class="board">
        <section class="viewer" aria-label="数组可视化与回放">
          <div class="graph">
            <div class="graph-head">
              <span class="graph-title"
                ><i data-icon="cube"></i><span id="graph-name">排序柱状图</span></span
              >
              <div class="graph-tools">
                <button type="button" id="flow" aria-pressed="true" title="开启或关闭排序操作的粒子特效">
                  粒子特效 · 开
                </button>
                <div class="angle" aria-label="图表视角">
                  <button data-view="front" aria-pressed="true">正视</button
                  ><button data-view="3d" aria-pressed="false">立体</button>
                </div>
              </div>
            </div>
            <div class="plot">
              <canvas id="plot" aria-label="黑白实心柱状图，柱高为数值，横轴为从零开始的下标。"></canvas>
            </div>
            <div class="plot-foot">
              <span class="legend"><i class="dot active"></i>当前操作<i class="dot"></i>其余元素</span
              ><span id="plot-source">工作数组 A</span>
            </div>
          </div>
          <div class="transport">
            <div class="scrubber">
              <label for="timeline">步骤</label
              ><input type="range" id="timeline" min="0" max="1" value="1" /><output
                for="timeline"
                id="progress"
                >1 / 1</output
              >
            </div>
            <div class="controls">
              <button id="play" class="primary"><i data-icon="play"></i><span>播放</span></button>
              <button id="first" class="icon-btn" aria-label="跳到初始数组" title="初始数组 (Home)">
                <i data-icon="first"></i>
              </button>
              <button id="prev" class="step" title="上一步 (←)">
                <i data-icon="previous"></i>上一步
              </button>
              <button id="next" class="step" title="下一步 (→)">下一步<i data-icon="next"></i></button>
              <button id="last" class="icon-btn" aria-label="跳到排序完成" title="排序完成 (End)">
                <i data-icon="last"></i>
              </button>
              <label class="rate"
                >速度
                <select id="speed">
                  <option value="0.5">0.5×</option>
                  <option value="1" selected>1×</option>
                  <option value="2">2×</option>
                  <option value="4">4×</option>
                </select></label
              >
            </div>
          </div>
        </section>
        <aside class="inspector" aria-label="步骤解析">
          <div class="inspect-top">
            <h2>步骤解析</h2>
            <span id="step-no"></span>
          </div>
          <div class="step-info">
            <div class="phase"><span id="action">比较</span><span id="phase"></span></div>
            <div id="formula"></div>
            <p id="note"></p>
            <div id="operands"></div>
          </div>
          <div class="source">
            <h3><i data-icon="code"></i>伪代码</h3>
            <ol id="pseudo"></ol>
          </div>
        </aside>
      </div>
      <section class="snapshot" aria-labelledby="array-title">
        <div class="array-head">
          <h2 id="array-title">数组快照 <span>A</span></h2>
          <div class="metrics">
            <span>比较 <b id="compares">0</b> 次</span><span>写入 <b id="writes">0</b> 次</span>
          </div>
        </div>
        <div class="array-scroll" tabindex="0" aria-label="当前工作数组，按下标从左到右排列">
          <div id="cells"></div>
        </div>
      </section>
      <footer><span id="facts"></span><span>下标从 0 开始 · v3.1.0-beta.1</span></footer>
    </main>
    <dialog id="dialog">
      <form method="dialog">
        <div class="dialog-head">
          <h2>快捷键</h2>
          <button class="icon-btn" aria-label="关闭"><i data-icon="close"></i></button>
        </div>
        <dl>
          <div>
            <dt>播放或暂停</dt>
            <dd><kbd>Space</kbd></dd>
          </div>
          <div>
            <dt>上一步 / 下一步</dt>
            <dd><kbd>←</kbd> <kbd>→</kbd></dd>
          </div>
          <div>
            <dt>初始数组 / 排序完成</dt>
            <dd><kbd>Home</kbd> <kbd>End</kbd></dd>
          </div>
        </dl>
        <p>立体视图可左右拖动调整角度。点选柱子或数组格可查看下标和值。</p>
      </form>
    </dialog>
  </body>
</html>
